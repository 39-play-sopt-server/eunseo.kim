spring:
  datasource:
    url: jdbc:h2:mem:assignment;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  issuer: assignment-test
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000
  refresh-cookie:
    name: refreshToken
    path: /auth
    secure: false
    same-site: Strict

kakao:
  rest-api-key: test-rest-api-key
  client-secret: test-client-secret
  redirect-uri: http://localhost:8080/auth/kakao/callback

oauth:
  success-redirect-uri: http://localhost:3000

  state-cookie:
    name: oauthState
    path: /auth
    secure: false
    same-site: Lax
    max-age-seconds: 300
